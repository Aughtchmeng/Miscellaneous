<!DOCTYPE html>
<html>
<head>
    <title>Click History Logger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f6f8;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform .2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .counter {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
        }

        #status {
            margin: 10px 0;
            font-style: italic;
        }

        #log {
            text-align: left;
            background: #222;
            color: #00ff66;
            padding: 15px;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🖱️ Click History Logger</h1>

    <div class="counter">
        Total Clicks: <span id="count">0</span>
    </div>

    <button onclick="saveClick()">Record Click</button>
    <button onclick="downloadLog()">Download Log</button>
    <button onclick="clearLog()">Clear Log</button>

    <p id="status">Waiting for a click...</p>

    <h2>History</h2>

    <div id="log"></div>

</div>

<script>

function saveClick() {

    const timestamp = new Date().toLocaleString();

    let clicks =
        JSON.parse(localStorage.getItem("clickHistory")) || [];

    clicks.push(timestamp);

    localStorage.setItem(
        "clickHistory",
        JSON.stringify(clicks)
    );

    document.getElementById("status").textContent =
        "Last click: " + timestamp;

    displayLog();
}

function displayLog() {

    let clicks =
        JSON.parse(localStorage.getItem("clickHistory")) || [];

    document.getElementById("count").textContent =
        clicks.length;

    let output = "";

    for (let i = 0; i < clicks.length; i++) {

        output +=
            "#" + (i + 1) +
            "  |  " +
            clicks[i] +
            "\n";
    }

    document.getElementById("log").textContent =
        output || "No clicks recorded yet.";
}

function downloadLog() {

    let clicks =
        JSON.parse(localStorage.getItem("clickHistory")) || [];

    let text = "";

    for (let i = 0; i < clicks.length; i++) {

        text +=
            "#" + (i + 1) +
            " | " +
            clicks[i] +
            "\n";
    }

    const blob =
        new Blob([text], { type: "text/plain" });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "click_log.txt";

    link.click();

    URL.revokeObjectURL(link.href);
}

function clearLog() {

    localStorage.removeItem("clickHistory");

    document.getElementById("status").textContent =
        "History cleared.";

    displayLog();
}

displayLog();

</script>

</body>
</html>
